[project]
name = "crew_studio"
version = "0.1.0"
description = "An AI engineering team (CrewAI) that designs, builds, tests, reviews and iterates on Python + Gradio products."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "gradio>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
studio-build = "crew_studio.main:build"
studio-improve = "crew_studio.main:improve"
studio-ui = "crew_studio.main:ui"
studio-plot = "crew_studio.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_studio"]

[tool.crewai]
type = "flow"
